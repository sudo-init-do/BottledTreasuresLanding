# Production deployment: `cp .env.example .env`, fill it in, then `docker compose up -d --build`.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bottled-treasures:latest
    container_name: bottled-treasures
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      # orders, payment receipts and product photos survive rebuilds and restarts
      - shop-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shop-data:

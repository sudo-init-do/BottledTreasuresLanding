<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-style:normal;src:url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2)}
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-style:italic;src:url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2)}
@font-face{font-family:"Jost";font-weight:400;src:url(node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2)}
@font-face{font-family:"Jost";font-weight:500;src:url(node_modules/@fontsource/jost/files/jost-latin-500-normal.woff2)}
</style>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const spec = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const W = spec.w || 1200, H = spec.h || 1500;

await document.fonts.load('500 80px "Cormorant Garamond"');
await document.fonts.load('italic 500 80px "Cormorant Garamond"');
await document.fonts.load('500 40px "Jost"');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = spec.exposure ?? 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(spec.bg || "#0D0404");
scene.background = BG;
scene.fog = new THREE.Fog(BG, spec.fogNear ?? 16, spec.fogFar ?? 60);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ color: "#0c0404", side: THREE.BackSide })));
const box = (w, h, pos, rot, col, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 1.5, 0); envScene.add(m); };
box(1.6, 12, [-7, 3, 3], 0, "#fff0d8", 5);
box(1.6, 12, [7, 3, 2], 0, "#fff0d8", 4);
box(6, 3, [0, 10, 2], 0, "#ffffff", 3);
box(10, 6, [0, 3, -9], 0, "#8a1c12", 1.2);
box(1.0, 8, [-3, 2, 9], 0, "#ffd9a0", 2.5);
scene.environment = pmrem.fromScene(envScene, 0.02).texture;
scene.environmentIntensity = spec.env ?? 1.0;

const camera = new THREE.PerspectiveCamera(spec.fov || 30, W / H, 0.1, 200);
const cp = spec.cam || [0, 2.2, 11];
camera.position.set(...cp);
camera.lookAt(...(spec.target || [0, 1.6, 0]));

// ---------- materials ----------
const gold = new THREE.MeshPhysicalMaterial({ color: "#D4AF5A", metalness: 1, roughness: 0.22, clearcoat: 0.6, clearcoatRoughness: 0.15 });
const goldBrushed = new THREE.MeshPhysicalMaterial({ color: "#C9A84C", metalness: 1, roughness: 0.38 });
const lacquer = new THREE.MeshPhysicalMaterial({ color: "#0b0606", metalness: 0.2, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05 });
const burgLacquer = new THREE.MeshPhysicalMaterial({ color: "#4a0f0f", metalness: 0.3, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 });
const glass = () => new THREE.MeshPhysicalMaterial({
  color: "#ffffff", metalness: 0, roughness: 0.04, transparent: true, opacity: spec.glassOpacity ?? 0.02,
  clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.4, specularIntensity: 1, depthWrite: false,
});
const glassEdge = new THREE.MeshPhysicalMaterial({ color: "#f3e3c8", metalness: 0, roughness: 0.06, transparent: true, opacity: 0.06, envMapIntensity: 1.2, side: THREE.BackSide, depthWrite: false });
const liquidMat = (c, dist = 2.2) => new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(c).lerp(new THREE.Color("#ffffff"), 0.35), metalness: 0, roughness: 0.05,
  transmission: 1, thickness: 1.0, ior: 1.36, attenuationColor: new THREE.Color(c), attenuationDistance: dist,
  envMapIntensity: 1.2, emissive: new THREE.Color(c), emissiveIntensity: spec.liquidGlow ?? 0.22,
});
const darkStone = new THREE.MeshPhysicalMaterial({ color: "#1a0b0b", roughness: 0.28, metalness: 0.1, clearcoat: 0.6, clearcoatRoughness: 0.2 });
const burgStone = new THREE.MeshPhysicalMaterial({ color: "#3a0d0d", roughness: 0.35, metalness: 0.05, clearcoat: 0.4 });

// ---------- environment: backdrop + floor ----------
const world = new THREE.Group(); scene.add(world);
const backdrop = new THREE.Mesh(
  new THREE.CylinderGeometry(30, 30, 40, 64, 1, true, Math.PI * 0.75, Math.PI * 0.5),
  new THREE.MeshStandardMaterial({ color: spec.backdrop || "#2b0909", roughness: 1, side: THREE.BackSide })
);
backdrop.position.set(0, 18, 14); world.add(backdrop);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ color: spec.floor || "#0a0303", transparent: true, opacity: 0.82 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; world.add(floor);

// ---------- lights ----------
const key = new THREE.SpotLight("#fff1dc", spec.key ?? 150, 0, Math.PI / 11, 0.9, 1.6);
key.position.set(-5, 9, 7); key.target.position.set(0, 2.2, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rimL = new THREE.SpotLight("#ffcf7a", spec.rim ?? 320, 0, Math.PI / 8, 0.6, 1.6);
rimL.position.set(-6, 4, -6); rimL.target.position.set(0, 1.5, 0); scene.add(rimL, rimL.target);
const rimR = new THREE.SpotLight("#ffd28a", spec.rim ?? 320, 0, Math.PI / 8, 0.6, 1.6);
rimR.position.set(6, 4.5, -5); rimR.target.position.set(0, 1.5, 0); scene.add(rimR, rimR.target);
const glow = new THREE.SpotLight(spec.glow || "#b02a18", spec.glowI ?? 260, 0, Math.PI / (spec.glowSpread || 6.5), 1, 1.2);
glow.position.set(...(spec.glowFrom || [0, 2.5, -3])); glow.target.position.set(...(spec.glowAt || [0, 2.6, -16])); scene.add(glow, glow.target);
const fill = new THREE.PointLight("#ffb070", 6, 0, 2); fill.position.set(3, 1, 6); scene.add(fill);

// ---------- label texture ----------
function labelTexture(name, sub, wpx = 512, hpx = 640, dark = false) {
  const c = document.createElement("canvas"); c.width = wpx; c.height = hpx;
  const g = c.getContext("2d");
  if (dark) { g.fillStyle = "#0d0404"; g.fillRect(0, 0, wpx, hpx); }
  g.strokeStyle = "#d4b062"; g.lineWidth = 3; g.strokeRect(14, 14, wpx - 28, hpx - 28);
  g.lineWidth = 1.2; g.strokeRect(26, 26, wpx - 52, hpx - 52);
  g.fillStyle = "#e0bf6d"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = 'italic 500 120px "Cormorant Garamond"'; g.fillText("BT", wpx / 2, hpx * 0.30);
  g.font = '500 26px "Jost"'; g.letterSpacing = "8px"; g.fillText("BOTTLED TREASURES", wpx / 2 + 4, hpx * 0.50);
  g.fillRect(wpx / 2 - 40, hpx * 0.57, 80, 2);
  g.font = '500 54px "Cormorant Garamond"'; g.letterSpacing = "2px";
  wrap(g, name.toUpperCase(), wpx / 2, hpx * 0.68, wpx - 90, 58);
  g.font = '400 20px "Jost"'; g.letterSpacing = "5px"; g.fillText(sub.toUpperCase(), wpx / 2 + 2, hpx * 0.88);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function wrap(g, text, x, y, maxW, lh) {
  const words = text.split(" "); let line = ""; const lines = [];
  for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line); const y0 = y - ((lines.length - 1) * lh) / 2;
  lines.forEach((l, i) => g.fillText(l, x, y0 + i * lh));
}
function labelMesh(name, sub, w, h, dark) {
  const tex = labelTexture(name, sub, 512, Math.round(512 * h / w), dark);
  const m = new THREE.MeshPhysicalMaterial({ map: tex, transparent: !dark, metalness: 0.4, roughness: 0.35, alphaTest: dark ? 0 : 0.02, emissive: new THREE.Color('#ffffff'), emissiveMap: tex, emissiveIntensity: 0.55 });
  if (!dark) { m.alphaMap = null; }
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
}

// ---------- bottle builders ----------
function lathe(points, segs = 96) { return new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), segs); }

function capMesh(type, mat, s = 1) {
  const g = new THREE.Group();
  let m;
  switch (type) {
    case "facet": m = new THREE.Mesh(new THREE.CylinderGeometry(0.42 * s, 0.5 * s, 0.85 * s, 8, 1), mat); m.position.y = 0.42 * s; break;
    case "cube": m = new THREE.Mesh(new RoundedBoxGeometry(0.95 * s, 0.95 * s, 0.95 * s, 4, 0.05 * s), mat); m.position.y = 0.48 * s; m.rotation.y = Math.PI / 4; break;
    case "sphere": m = new THREE.Mesh(new THREE.SphereGeometry(0.5 * s, 64, 48), mat); m.position.y = 0.48 * s; break;
    case "dome": m = new THREE.Mesh(lathe([[0, 0], [0.44 * s, 0], [0.44 * s, 0.35 * s], [0.38 * s, 0.6 * s], [0.22 * s, 0.75 * s], [0, 0.8 * s]]), mat); break;
    case "spray": {
      const a = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.2 * s, 0.35 * s, 48), mat); a.position.y = 0.17 * s; g.add(a);
      m = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * s, 0.3 * s, 0.7 * s, 48), mat); m.position.y = 0.7 * s; break;
    }
    case "tall": default: m = new THREE.Mesh(new THREE.CylinderGeometry(0.34 * s, 0.34 * s, 1.15 * s, 64), mat); m.position.y = 0.58 * s;
  }
  m.castShadow = true; g.add(m); return g;
}

/** Builds a bottle. Returns group with base at y=0. */
function bottle(o) {
  const g = new THREE.Group();
  const s = o.scale || 1;
  const fill = o.fill ?? 0.62;
  const liquid = liquidMat(o.liquid || "#a0521c", o.dist);
  const capMat = { gold, lacquer, burg: burgLacquer, brushed: goldBrushed }[o.capMat || "gold"];
  let topY, neckR = 0.17, labelW, labelH, labelY, labelZ;

  if (o.shape === "square" || o.shape === "flat") {
    const w = o.shape === "flat" ? 1.35 : 1.1, h = o.shape === "flat" ? 2.0 : 1.9, d = o.shape === "flat" ? 0.42 : 0.62, ch = 0.22;
    const shape = new THREE.Shape();
    shape.moveTo(-w + ch, 0); shape.lineTo(w - ch, 0); shape.lineTo(w, ch); shape.lineTo(w, h - ch); shape.lineTo(w - ch, h);
    shape.lineTo(-w + ch, h); shape.lineTo(-w, h - ch); shape.lineTo(-w, ch); shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: d * 2, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 4 });
    geo.translate(0, 0, -d);
    const gl = new THREE.Mesh(geo, glass()); g.add(gl, new THREE.Mesh(geo, glassEdge));
    const lh = 0.18 + (h - 0.36) * fill;
    const ls = new THREE.Shape(); const wi = w - 0.14, chi = ch * 0.8;
    ls.moveTo(-wi + chi, 0.16); ls.lineTo(wi - chi, 0.16); ls.lineTo(wi, 0.16 + chi); ls.lineTo(wi, lh); ls.lineTo(-wi, lh); ls.lineTo(-wi, 0.16 + chi); ls.closePath();
    const lg = new THREE.ExtrudeGeometry(ls, { depth: (d - 0.12) * 2, bevelEnabled: false }); lg.translate(0, 0, -(d - 0.12));
    g.add(new THREE.Mesh(lg, liquid));
    topY = h + 0.06; labelW = w * 1.05; labelH = w * 1.05 * 1.2; labelY = h * 0.48; labelZ = d + 0.07;
  } else {
    let prof;
    if (o.shape === "round") {
      prof = []; const R = 1.05, cy = 0.987;
      prof.push([0, 0]);
      for (let a = -70; a <= 70; a += 4) { const r = (a * Math.PI) / 180; prof.push([Math.cos(r) * R, cy + Math.sin(r) * R]); }
      prof.push([0.24, 2.0], [0.2, 2.08], [0, 2.08]);
      topY = 2.08; labelW = 0.9; labelH = 0.9; labelY = 0.95; labelZ = 1.06;
    } else if (o.shape === "tall") {
      prof = [[0, 0], [0.58, 0], [0.62, 0.05], [0.64, 0.15], [0.64, 2.6], [0.6, 2.75], [0.35, 2.9], [0.2, 2.95], [0, 2.95]];
      topY = 2.95; labelW = 0.95; labelH = 1.2; labelY = 1.3; labelZ = 0.66;
    } else if (o.shape === "vial") {
      prof = [[0, 0], [0.3, 0], [0.32, 0.04], [0.32, 1.5], [0.24, 1.6], [0.16, 1.62], [0, 1.62]];
      topY = 1.62; labelW = 0.45; labelH = 0.65; labelY = 0.7; labelZ = 0.34; neckR = 0.14;
    } else if (o.shape === "jar") {
      prof = [[0, 0], [0.95, 0], [0.98, 0.04], [0.98, 1.45], [0.94, 1.5], [0, 1.5]];
      topY = 1.5; labelW = 1.1; labelH = 0.75; labelY = 0.65; labelZ = 1.0;
    } else { // classic
      prof = [[0, 0], [0.88, 0], [0.95, 0.06], [0.98, 0.2], [0.98, 1.75], [0.9, 2.0], [0.6, 2.2], [0.24, 2.3], [0, 2.3]];
      topY = 2.3; labelW = 1.1; labelH = 1.25; labelY = 1.0; labelZ = 1.0;
    }
    const lg0 = lathe(prof); const gl = new THREE.Mesh(lg0, glass()); g.add(gl, new THREE.Mesh(lg0, glassEdge));
    // liquid: inset profile clipped to fill height
    const maxY = prof.reduce((m, p) => Math.max(m, p[1]), 0);
    const ly = 0.14 + (maxY * 0.82 - 0.14) * fill;
    const lp = [[0, 0.14]];
    for (let i = 1; i < prof.length; i++) {
      const [x, y] = prof[i]; if (y < 0.14) continue; if (y > ly) break; lp.push([Math.max(0, x - 0.09), y]);
    }
    const last = lp[lp.length - 1]; lp.push([last[0], ly], [0, ly]);
    lp[0] = [0, 0.14]; if (lp[1] && lp[1][1] > 0.14) lp.splice(1, 0, [Math.max(0, prof[1][0] - 0.12), 0.14]);
    g.add(new THREE.Mesh(lathe(lp), liquid));
  }

  if (o.cap === "none") {
    // open neck (diffuser)
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(neckR + 0.06, neckR + 0.06, 0.16, 64), gold);
    collar.position.y = topY + 0.08; g.add(collar);
  } else if (o.shape !== "jar") {
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(neckR + 0.06, neckR + 0.06, 0.16, 64), gold);
    collar.position.y = topY + 0.08; collar.castShadow = true; g.add(collar);
    const cap = capMesh(o.cap || "facet", capMat, o.capScale || 1); cap.position.y = topY + 0.16; g.add(cap);
  } else if (o.lid !== false) {
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.22, 96), capMat); lid.position.y = topY + 0.11; lid.castShadow = true; g.add(lid);
  }
  if (o.label !== false) {
    const lab = labelMesh(o.name || "Signature", o.sub || "Eau de Parfum", labelW, labelH, o.darkLabel);
    lab.position.set(0, labelY, labelZ + 0.002); g.add(lab);
  }
  if (o.reeds) {
    const wood = new THREE.MeshStandardMaterial({ color: "#2a160c", roughness: 0.8 });
    for (let i = 0; i < 9; i++) {
      const r = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 3.6, 8), wood);
      const a = (i / 9) * Math.PI * 2, tilt = 0.1 + (i % 3) * 0.06;
      r.position.set(Math.cos(a) * 0.08, topY + 1.5, Math.sin(a) * 0.08);
      r.rotation.set(Math.sin(a) * tilt, 0, Math.cos(a) * tilt); r.castShadow = true; g.add(r);
    }
  }
  if (o.candle) {
    const wax = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 1.1, 96), new THREE.MeshStandardMaterial({ color: "#2a0c0c", roughness: 0.6 }));
    wax.position.y = 0.7; g.add(wax);
    const flame = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 16), new THREE.MeshBasicMaterial({ color: "#ffcf7a" }));
    flame.scale.set(1, 2.4, 1); flame.position.y = 1.55; g.add(flame);
    const fl = new THREE.PointLight("#ffb050", 8, 0, 2); fl.position.y = 1.6; g.add(fl);
  }
  g.scale.setScalar(s);
  g.traverse((m) => { if (m.isMesh && !m.material.transparent) m.castShadow = true; });
  return g;
}

function prop(p) {
  let m;
  const mat = { dark: darkStone, burg: burgStone, gold: goldBrushed, lacquer }[p.mat || "dark"];
  if (p.type === "box") m = new THREE.Mesh(new RoundedBoxGeometry(p.size[0], p.size[1], p.size[2], 4, 0.03), mat);
  else if (p.type === "cyl") m = new THREE.Mesh(new THREE.CylinderGeometry(p.size[0], p.size[0], p.size[1], 96), mat);
  else if (p.type === "sphere") m = new THREE.Mesh(new THREE.SphereGeometry(p.size[0], 64, 48), mat);
  else if (p.type === "ring") m = new THREE.Mesh(new THREE.TorusGeometry(p.size[0], p.size[1], 32, 200), mat);
  m.position.set(...p.pos); if (p.rot) m.rotation.set(...p.rot);
  m.castShadow = m.receiveShadow = true; return m;
}

// ---------- compose ----------
const objects = new THREE.Group(); scene.add(objects);
for (const b of spec.bottles || []) {
  const m = bottle(b); m.position.set(...(b.pos || [0, 0, 0])); m.rotation.y = b.rotY || 0; objects.add(m);
}
for (const p of spec.props || []) objects.add(prop(p));

// mirrored copy for floor reflection
const mirror = objects.clone(true);
mirror.scale.y = -1; mirror.traverse((m) => { if (m.isMesh) { m.castShadow = false; } });
scene.add(mirror);

console.log('built', performance.now()|0);
renderer.compile(scene, camera);
console.log('compiled', performance.now()|0);
renderer.render(scene, camera);
renderer.render(scene, camera);
console.log('rendered', performance.now()|0);
window.renderDone = true;
</script>
</body>
</html>
